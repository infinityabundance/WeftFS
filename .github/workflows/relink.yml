name: Relink packages (temporary)
on: workflow_dispatch
permissions:
  packages: write
  contents: read
jobs:
  delete:
    runs-on: ubuntu-latest
    steps:
      - name: Delete subproject packages so their repos can own them
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for pkg in weftcodec weftcodec-go weftfs-go; do
            echo "== $pkg"
            curl -sS -o /tmp/out -w "%{http_code}\n" -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/infinityabundance/WeftFS/packages/container/$pkg"
            cat /tmp/out
            echo
          done
