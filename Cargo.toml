[package]
name = "weftfs"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "WeftFS v1 transactional store core (no FUSE frontend yet)"
license = "Apache-2.0"
repository = "https://github.com/infinityabundance/WeftFS"

[[bin]]
name = "weftfs"
path = "src/main.rs"

[dependencies]
weftcodec = { path = "WeftCodec" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32c = "0.6"
hex = "0.4"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

[workspace]
resolver = "2"
exclude = ["WeftCodec", "WeftCodec-Go", "WeftFS-Go"]

[profile.release]
opt-level = 3

[profile.test]
opt-level = 1
