[package]
name = "weftfs"
version = "1.4.0"
edition = "2021"
rust-version = "1.77"
description = "WeftFS v1 transactional store core and Linux FUSE frontend"
license = "Apache-2.0"
repository = "https://github.com/infinityabundance/WeftFS"
readme = "README.md"
exclude = [
    "bench/**",
    "docs/**",
    "spec/**",
    "verification/**",
    "scripts/**",
    "adapters/**",
    ".github/**",
    "WeftCodec/**",
    "WeftCodec-Go/**",
    "WeftFS-Go/**",
    "research/**",
]

[[bin]]
name = "weftfs"
path = "src/main.rs"

[dependencies]
weftcodec = { version = "1.4.0", path = "WeftCodec" }
# Streaming BLAKE3 for the frozen v1 whole-file ContentId. `weftcodec` already
# depends on this exact crate, so no new network fetch is introduced.
blake3 = "1"
# SHA-256 container digests for safetensors checkpoints. `sha2` is already in
# the dependency graph through `ed25519-dalek`, so no new crate is fetched.
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32c = "0.6"
hex = "0.4"
# fuser diagnostics (e.g. a dropped reply) are surfaced through `log`.
log = { version = "0.4", optional = true }
# P5 Linux FUSE frontend. 0.18.0 negotiates the current kernel ABI; the
# previous pinned 0.15.1 produced intermittent kernel-side EIO on direct
# writes under kernel 7.3 while the daemon logged a successful reply.
fuser = { version = "=0.15.1", optional = true, features = ["abi-7-31"] }
ctrlc = { version = "3", optional = true }
# Used by the 3FS USRBIO C-ABI boundary (`src/threefs/ffi.rs`) for `dlopen`,
# `dlsym`, `close`, and `timespec`. Already in the dependency graph through
# `fuser`; making it unconditional does not add a crate to the lock file.
libc = "0.2"
# Minimal blocking HTTP client for the S3-compatible backend (subphase Q4).
# rustls-backed; the court talks plain HTTP to MinIO, while a real endpoint can
# use HTTPS. No ASGI/async runtime is pulled in.
ureq = { version = "2.12", default-features = false, features = ["tls"] }
# Optional Ed25519 signatures on retention bindings (subphase R6). Already in
# the dependency graph through `weftcodec`'s capability envelopes, so no new
# crate is fetched.
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }

[features]
fuse = ["dep:fuser", "dep:ctrlc", "dep:log"]

[dev-dependencies]
tempfile = "3"
# Raw xattr syscalls in the FUSE integration tests (feature-gated files).
libc = "0.2"
# Content-defined-dedup + zstd baseline for the F7 AI-corpus cost graph.
# The bench court already ships this crate through `weftcodec`, so no new
# network fetch is required.
zstd = "0.13"

[workspace]
resolver = "2"
exclude = ["WeftCodec", "WeftCodec-Go", "WeftFS-Go"]

[profile.release]
opt-level = 3

[profile.test]
opt-level = 1
